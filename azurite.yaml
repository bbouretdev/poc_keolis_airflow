apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: azurite-pvc
  namespace: airflow
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: azurite
  namespace: airflow
  labels:
    app: azurite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: azurite
  template:
    metadata:
      labels:
        app: azurite
    spec:
      containers:
        - name: azurite
          image: mcr.microsoft.com/azure-storage/azurite:latest
          command:
            - azurite-blob
            - --blobHost
            - 0.0.0.0
            - --location
            - /data
          ports:
            - containerPort: 10000
              name: blob
          volumeMounts:
            - name: azurite-storage
              mountPath: /data
      volumes:
        - name: azurite-storage
          persistentVolumeClaim:
            claimName: azurite-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: azurite
  namespace: airflow
spec:
  type: ClusterIP
  selector:
    app: azurite
  ports:
    - port: 10000
      targetPort: 10000
      name: blob