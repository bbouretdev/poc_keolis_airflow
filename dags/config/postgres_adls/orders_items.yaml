dag_id: "postgres_to_adls__orders_items"
description: "Exportation des tables orders et items avec gestion de l'incrémentalité"
schedule: null

params:
  ID_PIPELINE: "postgres_to_adls__orders_items"
  GIT_CONN_ID: "git-dlt"
  POSTGRESQL_SOURCE: "postgres_source"
  
  USE_AZURITE: "true"
  AZURE_CONN_ID: "azure_storage_default"
  
  SCHEMA_SOURCE: "dlt"

  TABLES:
    # Exemple 1 : Table chargée en incrémental avec Watermark Minuit
    - source: "orders"
      target_name: "ventes/2026/commandes_export"
      write_strategy: "append"
      cursor_column: "created_at"

    # Exemple 2 : Table de référence chargée en replace complet
    - source: "items"
      target_name: "referentiel/articles_export"
      write_strategy: "replace"
  
  CONTENEUR_AZURE: "target-data"
  MOTEUR_DLT: "pyarrow"
  STRATEGIE_ECRITURE: "replace"
  TAILLE_LOT: 100000