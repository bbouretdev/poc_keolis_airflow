dag_id: "postgres_to_adls__pyarrow_vs_connectorx_schema_comparison"
description: "Exportation des tables orders et items vers Parquet"
schedule: null

# 1. Infrastructures & Connexions
infrastructure:
  git_connection_id: "git-dlt"
  postgres_connection_id: "postgres_source"
  azure_connection_id: "azure_storage_default"
  use_azurite: true

# 2. Définition des tables et réglages par table
pipeline:
  tables:
    - source:
        schema: "public"
        table: "test_precision_moteurs"
        backend: "pyarrow"
        chunk_size: 100000

      target:
        container: "target-data"
        dataset: "billetique"
        name: "pyarrow/test_precision_moteurs"
        format: "parquet"
        write_strategy: "replace"
        use_partition: false  # Mis à false car partition_col est à null
        partition_col: null